name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plugin:
    name: plugin (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # The plugin has no runtime dependencies, but the tests use Playwright.
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # GitHub runners cannot start Chromium's sandbox with unprivileged user
      # namespaces; this only affects the test browser, not normal users.
      - name: Test (unit + real Chromium)
        env:
          DSH_BROWSER_NO_SANDBOX: "1"
        run: xvfb-run -a npm test

  mcp:
    name: mcp (node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mcp
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Test (config + certificate behaviour)
        run: xvfb-run -a npm test

  # Builds the browser-pods image to catch Dockerfile regressions. Slow (apt +
  # Chromium download), non-blocking, and only on main pushes.
  docker:
    name: docker image (optional)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build browser-pods image
        run: docker build -t browser-pods:ci ./mcp
